name: Verify saved review-queue pilot (offline)
on:
  pull_request:
    paths: ['experiments/jev/**', '.github/workflows/jev-review-queue-results.yml']
  push:
    branches: [main]
    paths: ['experiments/jev/**', '.github/workflows/jev-review-queue-results.yml']
permissions:
  contents: read
jobs:
  reproduce-review-pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.25.1
      - run: python -B -m experiments.jev.review_queue_results_v1.verify
