name: Jev live bridge (offline tests)
on:
  pull_request:
    paths: ['experiments/jev/**', '.github/workflows/jev-live-bridge.yml']
  push:
    branches: [main]
    paths: ['experiments/jev/**', '.github/workflows/jev-live-bridge.yml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sdk: [false, true]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.25.1
      - if: matrix.sdk
        run: python -m pip install -r experiments/jev/requirements-live.txt
      - run: python -B -m unittest discover -s experiments/jev/live_v1/tests -v
