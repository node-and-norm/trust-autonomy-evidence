name: Validate repository

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Validate research artifacts
        run: python scripts/validate_repository.py
      - name: Validate paper workspace
        run: python scripts/validate_paper.py
      - name: Validate frozen release snapshots
        run: python scripts/validate_release_snapshot.py
      - name: Navigation, license, and isolated historical replay tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
