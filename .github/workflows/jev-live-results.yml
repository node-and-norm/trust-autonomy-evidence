name: Verify saved Jev results (offline)
on:
  pull_request:
    paths: ['experiments/jev/**', '.github/workflows/jev-live-results.yml']
  push:
    branches: [main]
    paths: ['experiments/jev/**', '.github/workflows/jev-live-results.yml']
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.25.1
      - run: python -B -m experiments.jev.live_results_v1.verify
      - run: python -B -m experiments.jev.live_followup_v1.analyze --check
