name: Jev evidence v2 (offline)
on:
  pull_request:
    paths:
      - 'experiments/jev/**'
      - '.github/workflows/jev-evidence-v2.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/jev/**'
      - '.github/workflows/jev-evidence-v2.yml'
permissions:
  contents: read
jobs:
  evidence-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.25.1
      - run: python -m unittest discover -s experiments/jev/evidence_v2/tests -v
