name: Jev author audit amendment (offline)
on:
  pull_request:
    paths:
      - 'experiments/jev/**'
      - '.github/workflows/jev-author-audit.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/jev/**'
      - '.github/workflows/jev-author-audit.yml'
permissions:
  contents: read
jobs:
  author-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.25.1
      - run: python -m unittest discover -s experiments/jev/author_audit_v1/tests -v
