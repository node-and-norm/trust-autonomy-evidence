name: Verify collaborative Jev review (offline)
on:
  pull_request:
    paths: ['experiments/jev/**', '.github/workflows/jev-collaborative-review.yml']
  push:
    branches: [main]
    paths: ['experiments/jev/**', '.github/workflows/jev-collaborative-review.yml']
permissions:
  contents: read
jobs:
  preserve-collaborative-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B -m experiments.jev.collaborative_review_v1.verify
