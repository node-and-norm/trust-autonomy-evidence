name: Jev experiment (offline)

on:
  pull_request:
    paths:
      - 'experiments/jev/**'
      - '.github/workflows/jev-experiment.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/jev/**'
      - '.github/workflows/jev-experiment.yml'

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sdk: [absent, installed]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.25.1
      - if: matrix.sdk == 'installed'
        run: python -m pip install -r experiments/jev/requirements-live.txt
      - name: Network-free adapter and output checks
        run: python -m unittest discover -s experiments/jev/tests -v
      - name: Dry run of baseline and mutations
        run: python -m experiments.jev.run --mode dry-run --mutations --output experiments/jev/runs/ci-dry
