name: Jev review queue (offline)
on:
  pull_request:
    paths: ['experiments/jev/**', '.github/workflows/jev-review-queue.yml']
  push:
    branches: [main]
    paths: ['experiments/jev/**', '.github/workflows/jev-review-queue.yml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.25.1
      - run: python -B -m unittest discover -s experiments/jev/review_queue_v1/tests -v
