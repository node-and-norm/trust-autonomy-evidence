name: Jev adjudication amendment (offline)

on:
  pull_request:
    paths:
      - 'experiments/jev/**'
      - '.github/workflows/jev-adjudication.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/jev/**'
      - '.github/workflows/jev-adjudication.yml'

permissions:
  contents: read

jobs:
  records:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.25.1
      - name: Source preservation and dated adjudication controls
        run: python -m unittest discover -s experiments/jev/adjudication_v2/tests -v
